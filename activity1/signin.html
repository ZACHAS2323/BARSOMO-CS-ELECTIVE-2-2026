<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 1 | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form id="signinForm" novalidate>
            <div class="form-control">
                <label for="signinEmail">Email</label>
                <input type="email" id="signinEmail" placeholder="Enter your email">
                <span class="error-msg" id="signinEmailError"></span>
            </div>
            <div class="form-control">
                <label for="signinPassword">Password</label>
                <input type="password" id="signinPassword" placeholder="Enter your password">
                <span class="error-msg" id="signinPasswordError"></span>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <p class="switch-page">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
